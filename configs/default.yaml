# ──────────────────────────────────────────────
#  warehouse_ai – default configuration
# ──────────────────────────────────────────────

paths:
  data_raw: data/raw
  data_processed: data/processed
  configs: configs
  outputs: outputs

random_seed: 42

warehouse:
  trolley_capacity: 27          # max shoe pairs per picking trolley
  io_depot_node: CC-08          # dispatch depot node label
  num_aisles: 17
  num_racks: 25
  num_locations: 2293
  slots_per_location: 18        # bin slots per shelf location
  pick_levels: [0, 1, 2]        # manual picking levels
  reserve_levels: [3, 4]        # forklift replenishment levels

labor:
  walk_speed_mps: 1.0             # m/s, trolley-loaded (literature: 0.8–1.2 m/s)
  setup_per_wave_s: 60.0          # take pick list + trolley, drop at staging (s)
  per_location_stop_s: 10.0       # stop, read label, position at shelf (s per distinct location)
  per_unit_handling_s: 6.0         # grab one box, place on trolley (s per picked unit)
  level_penalty_s: 5.0            # extra retrieval time per vertical tier above level 1 (s)
  shift_hours: 7.5                # productive picking hours per FTE per day
  m_per_unit_along: 0.0732        # metres per raw coordinate unit along aisles (x-axis)
  m_per_unit_cross: 0.03222       # metres per raw coordinate unit across aisles (y-axis)

forecasting:
  horizon_days: 14
  backtest_weeks: 8
  alpha_croston: 0.1
  intermittent_threshold: 0.70

staffing:
  permanent_operators: 2          # core fixed warehouse employees
  shift_hours: 7.5                # standard shift length in hours
  productive_ratio: 0.85          # productive time efficiency (breaks, briefings, fatigue)
  absenteeism_rate: 0.05          # expected daily absenteeism rate
  daily_wage_rate: 150.0          # CAD $ per daily-wage worker per shift
  permanent_daily_rate: 180.0     # CAD $ per permanent operator per shift
  overtime_hourly_rate: 35.0      # CAD $ per overtime hour
  cutoff_hour: 17                 # outbound dispatch cutoff hour (5:00 PM)

replenishment:
  lead_time_days: 7               # supplier replenishment lead time
  review_period_days: 7           # periodic inventory review cycle
  service_level_a: 0.98           # Class A items target fill rate (z = 2.05)
  service_level_b: 0.95           # Class B items target fill rate (z = 1.65)
  service_level_c: 0.90           # Class C items target fill rate (z = 1.28)
  pick_face_min_units: 2          # forward pick-face safety threshold (pairs)
  pick_face_max_units: 6          # forward pick-face top-up capacity (pairs)

wave_planning:
  max_units_per_wave: 27          # trolley capacity (pairs); mirrors warehouse.trolley_capacity
  max_orders_per_wave: 24         # maximum customer orders batched per wave
  default_algorithm: fcfs         # fcfs | seed_savings | aisle_cluster
  storage_policy: random          # storage layout used for SKU→location resolution

llm:
  provider: mock                # gemini | anthropic | mock
  model: gemini-2.0-flash
  temperature: 0.1
  max_tokens: 4096

